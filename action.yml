name: 'Setup chore'
description: 'Install the chore task runner and put it on PATH.'
author: 'getchore'

branding:
  icon: 'terminal'
  color: 'orange'

inputs:
  version:
    description: 'Release tag to install, e.g. v1.4.1. Defaults to the latest release.'
    required: false
    default: ''

outputs:
  version:
    description: 'The version that was installed, as reported by `chore --version`.'
    value: ${{ steps.report.outputs.version || steps.report-windows.outputs.version }}

runs:
  using: composite
  steps:
    # The two branches live here so they do not live in anyone's workflow.
    - name: Install chore (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: curl -fsSL https://getchore.github.io/install.sh | sh -s -- ${{ inputs.version }}

    - name: Install chore (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $block = [scriptblock]::Create((Invoke-RestMethod https://getchore.github.io/install.ps1))
        & $block ${{ inputs.version }}

    # PATH is written in the shell the caller's own steps will run in. bash on a Windows
    # runner is Git Bash, where $HOME expands to /c/Users/..., and PowerShell -- the default
    # there -- cannot resolve that form. Reporting the version from bash too would keep
    # passing, because the path it just wrote is the one form Git Bash does understand.
    - name: Add to PATH (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Add to PATH (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $HOME '.local\bin')

    - name: Report version (Unix)
      id: report
      if: runner.os != 'Windows'
      shell: bash
      run: echo "version=$(chore --version)" >> "$GITHUB_OUTPUT"

    - name: Report version (Windows)
      id: report-windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$(chore --version)"
